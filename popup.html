<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Overdrive</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="panel">
      <div class="panel__accent"></div>

      <header class="panel__header">
        <div class="brand">
          <svg class="brand__dial" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="16" class="brand__face" />

            <line x1="20" y1="20" x2="30" y2="10" class="brand__needle" />

            <circle cx="20" cy="20" r="2.6" class="brand__hub" />
          </svg>

          <div>
            <p class="brand__name">Overdrive</p>

            <p class="brand__site" id="siteLabel">this page</p>
          </div>
        </div>
      </header>

      <!-- VOLUME -->
      <section class="module" data-module="volume">
        <div class="module__row">
          <div class="module__label">
            <svg
              class="module__icon icon-volume"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M4 9v6h4l5 4V5L8 9H4z" />

              <path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7" />

              <path class="wave wave--outer" d="M19 6a8.5 8.5 0 0 1 0 12" />
            </svg>

            <label for="volumeSlider"> Volume </label>
          </div>

          <span class="readout" id="volumeReadout"> 100<small>%</small> </span>
        </div>

        <div class="fader">
          <button
            class="step step--minus"
            data-target="volume"
            aria-label="Decrease volume by 1%"
          >
            &minus;
          </button>

          <div class="fader__track">
            <div class="fader__line">
              <div
                class="fader__default"
                style="left: calc(8px + 0.4 * (100% - 16px))"
              ></div>

              <input
                type="range"
                id="volumeSlider"
                min="0"
                max="250"
                step="1"
                value="100"
              />
            </div>

            <div class="fader__ticks">
              <span style="left: calc(8px + 0 * (100% - 16px))"> 0 </span>

              <span style="left: calc(8px + 0.2 * (100% - 16px))"> 50 </span>

              <span
                class="fader__tick--native"
                style="left: calc(8px + 0.4 * (100% - 16px))"
              >
                100
              </span>

              <span style="left: calc(8px + 0.6 * (100% - 16px))"> 150 </span>

              <span style="left: calc(8px + 0.8 * (100% - 16px))"> 200 </span>

              <span style="left: calc(8px + 1 * (100% - 16px))"> 250 </span>
            </div>
          </div>

          <button
            class="step step--plus"
            data-target="volume"
            aria-label="Increase volume by 1%"
          >
            &plus;
          </button>
        </div>

        <div class="presets" data-target="volume">
          <button data-value="50">50%</button>

          <button data-value="100">100%</button>

          <button data-value="150">150%</button>

          <button data-value="200">200%</button>

          <button data-value="250">250%</button>
        </div>
      </section>

      <!-- SPEED -->
      <section class="module" data-module="speed">
        <div class="module__row">
          <div class="module__label">
            <svg
              class="module__icon icon-speed"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M12 21a9 9 0 1 1 9-9" />

              <path d="M12 12l4.2-4.2" stroke-linecap="round" />

              <circle cx="12" cy="12" r="1.4" />
            </svg>

            <label for="speedSlider"> Speed </label>
          </div>

          <span class="readout" id="speedReadout"> 1.00<small>x</small> </span>
        </div>

        <div class="fader">
          <button
            class="step step--minus"
            data-target="speed"
            aria-label="Decrease speed by 0.05x"
          >
            &minus;
          </button>

          <div class="fader__track">
            <div class="fader__line">
              <div
                class="fader__default"
                style="left: calc(8px + 0.076923 * (100% - 16px))"
              ></div>

              <input
                type="range"
                id="speedSlider"
                min="0.25"
                max="10"
                step="0.05"
                value="1"
              />
            </div>

            <div class="fader__marks">
              <span style="left: calc(8px + 0.025641 * (100% - 16px))"></span>

              <span style="left: calc(8px + 0.076923 * (100% - 16px))"></span>

              <span style="left: calc(8px + 0.128205 * (100% - 16px))"></span>

              <span style="left: calc(8px + 0.179487 * (100% - 16px))"></span>

              <span style="left: calc(8px + 0.384615 * (100% - 16px))"></span>

              <span style="left: calc(8px + 0.794872 * (100% - 16px))"></span>

              <span style="left: calc(8px + 1 * (100% - 16px))"></span>
            </div>

            <div class="fader__ticks">
              <span style="left: calc(8px + 0.025641 * (100% - 16px))">
                0.5
              </span>

              <span
                class="fader__tick--native"
                style="left: calc(8px + 0.076923 * (100% - 16px))"
              >
                1
              </span>

              <span style="left: calc(8px + 0.128205 * (100% - 16px))">
                1.5
              </span>

              <span style="left: calc(8px + 0.179487 * (100% - 16px))">
                2
              </span>

              <span style="left: calc(8px + 0.384615 * (100% - 16px))">
                4
              </span>

              <span style="left: calc(8px + 0.794872 * (100% - 16px))">
                8
              </span>

              <span style="left: calc(8px + 1 * (100% - 16px))"> 10 </span>
            </div>
          </div>

          <button
            class="step step--plus"
            data-target="speed"
            aria-label="Increase speed by 0.05x"
          >
            &plus;
          </button>
        </div>

        <div class="presets presets--speed" data-target="speed">
          <button data-value="0.25">0.25x</button>

          <button data-value="0.5">0.5x</button>

          <button data-value="1">1x</button>

          <button data-value="1.5">1.5x</button>

          <button data-value="2">2x</button>

          <button data-value="4">4x</button>

          <button data-value="8">8x</button>

          <button data-value="10">10x</button>
        </div>
      </section>

      <!-- FOOTER -->
      <footer class="panel__footer">
        <button class="reset" id="resetBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="reset__icon">
            <path d="M4 12a8 8 0 1 1 2.6 5.9" />
            <path d="M4 20v-5h5" />
          </svg>

          Reset to normal
        </button>

        <p class="hint">Settings saved per site</p>

        <a
          class="creator"
          href="https://github.com/JewelShahi"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Jewel Shahi on GitHub"
        >
          <svg class="creator__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.26c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.45 11.45 0 0 1 6-.02c2.29-1.55 3.29-1.23 3.29-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.62-2.81 5.65-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"
            />
          </svg>

          <span>Jewel Shahi</span>
        </a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
